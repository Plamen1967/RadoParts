<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        font-size: 0.9rem;
      }

      body {
        width: 100%;
        display: flex;
        justify-content: center;
        min-width: 450px;
      }

      #item-container {
        border: 1px solid black;
        border-radius: 5px;
        background-color: whitesmoke;
        display: flex;
        flex-direction: column;
        justify-content: center;
        cursor: pointer;
        box-shadow: 4px 4px 4px rgba(113, 115, 116, 0.);
      }
      /*#region Title*/

      .item-title {
        font-size: 1rem;
        background-color: blue;
        color: white;
        padding: 2px 4px;
        width: 100%;
      }

      .item-title-link {
        font-size: 1rem;
        margin-bottom: 10px;
        color: white;
        padding: 2px 4px;
        width: 100%;
      }

      /*#endregion  RegionName*/

      /*#region Content */

      .item-content {
        background-color: lightgray;
        display: inline-flex;
        border-radius: 5px;
        justify-content: space-between;
        flex-direction: row;
        align-items: center;
        padding: 10px;
        width: 100%;
        height: 250px;
      }

      .item-image {
        height: 240px;
        max-width: 100%;
        justify-content: left;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        margin-right: 6px;

      }

      img {
        box-sizing: border-box;
        object-fit: contain;
        width: 150px;
        min-width: 150px;
        height: 90%;
      }

      .image-number {
        display: flex;
        justify-content: center;
        background-color: rgb(17, 170, 221);
        color: white;
        border-radius: 5px;
        align-items: center;
        height: 10%;
        width: 100%;
      }

      .item-tags {
        display: flex;
        flex-direction: column;
        align-items: start;
        height: 100%;
        width: 100%;
      }

      .tag:nth-child(odd) {
        background-color: lightblue;
      }

      .tag:nth-child(even) {
        background-color: rgb(216, 241, 216);
      }

      .tag {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        justify-content: start;
        padding: 2px 4px;
      }

      .item-dealer {
        font-size: 0.9m;
        padding: 2px 4px;
        display: flex;
        justify-content: end;
        align-items: start;
      }

      /*#endregion Content */

      a {
        text-decoration: none;
        color: black;
        cursor: pointer;
      }
      .image-details {
        display: flex;
        position: relative;
        padding: 10px 10px;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        background-color: lightcoral;
        justify-content: left;
      }
    </style>
  </head>
  <body>
    <div
      id="item-container"
      class="col-12 col-sm-10 col-md-8 col-lg-6 item-container"
      onclick="
        window.location = 'https://radoparts.com/viewPart?id=1734559057451'
      "
    >
      <div class="item-title w-100 text-center">
        <a
          href="https://radoparts.com/viewPart?id=1734559057451"
          target="_blank"
          class="item-title-link"
        >
          Колa на части - Audi 100 (43) 1.9 (100 Hp)</a
        >
      </div>
      <div class="item-content">
        <div class="item-image">
          <img
            src="https://radoparts.com/photos/1734559057451/min/393.jpeg"
            alt="Item Image"
            class="img-thumbnail"
          />
          <div class="image-number">2 Снимки</div>
        </div>
        <div class="item-tags">
          <div class="tag">
            <div>Цена</div>
            <div>100 лв.</div>
          </div>
          <div class="tag">
            <div>Регион</div>
            <div>Варна.</div>
          </div>
          <div class="tag">
            <div>Публикувана</div>
            <div>10/12/2025</div>
          </div>
        </div>
        <div style="align-items: start; min-height: 100%">
          <div class="item-dealer">Радо Партс</div>
        </div>
      </div>
    </div>
  </body>
  <script src="js/item.js"></script>
</html>
