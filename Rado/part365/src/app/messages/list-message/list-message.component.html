<div class="d-inline-flex flex-row w-100">
    <div style="margin: auto"></div>
    <div class="d-inline-flex flex-column w-100">
        <div class="d-inline-flex flex-row w-100 justify-content-between mb-3 mt-3 align-items-center">
            <select>
                <option value="all">Всички съобщения</option>
                <option value="unread">Непрочетени съобщения</option>
                <option value="read">Прочетени съобщения</option>
            </select>
            <select>
                <option value="newest">Най-нови първи</option>
                <option value="oldest">Най-стари първи</option>
            </select>
        </div>
        @for (message of messages; track message.id) {
            <app-message-view [message]="message"></app-message-view>
        }
    </div>
    <div style="margin: auto"></div>
</div>
