<div class="container">
    @if (saving()) {
        <div>
            <button class="btn btn-primary" type="button" disabled>
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Saving...
            </button>
        </div>
    } @else {
        <div>
            @if(bus()) {
                <div class="title">Бус на части</div>
            }@else {
                <div class="title">Кола на части</div>
            }
        </div>
        <div class="card p-2" style="background-color: khaki">
            <form autocomplete="off">
                <div class="row g-3">
                    <div class="col-sm-2 min200px">
                        <app-company-choise testId="companyId" [config]="{ required: true, submitted: submitted(), userId: $userId(), bus: bus(), all: true }" [formField]="addCarForm.companyId"> </app-company-choise>
                    </div>
                    @if (addCarForm.companyId().value()) {
                        <div class="col-sm-3 col-md-3 col-lg-3 min300px" style="min-width: 300px">
                            <app-model-choice
                                [isRequired]=true
                                [formField]="addCarForm.modelId"
                                [userId]="$userId()"
                                [all]="true"
                                [submitted]="submitted()"
                                [companyId]="addCarForm.companyId().value()!"
                                [showGroup]="true"
                                [groupDisabled]="true"
                                [useFilter]="true"
                                [multiselection]="false"
                                (onCloseEvent)="focus()">
                            </app-model-choice>
                        </div>
                        @if (!bus() && addCarForm.modelId().value()) {
                            <div class="col-sm-3 col-md-3 col-lg-3 min300px">
                                <app-modification-choice
                                    [isRequired]="true"
                                    [modelsId]="addCarForm.modelId().value()!"
                                    [userId]="$userId()"
                                    [all]="true"
                                    [multiselection]="false"
                                    [submitted]="submitted()"   
                                    [formField]="addCarForm.modificationId"
                                    (modifcationChange)="modificatioChanged($event)"
                                    (onCloseEvent)="focus()">
                                    >
                                </app-modification-choice>
                            </div>
                            <div class="col-sm-3 col-md-3 col-lg-3 min150px">
                                <app-select [formField]="addCarForm.year" label="{{ labels.YEAR }}" [data]="$years()" [submitted]="submitted()" (onCloseEvent)="focus()"> </app-select>
                            </div>
                        }
                    }
                </div>
                <div class="row">
                    <div class="col-sm-3 col-md-3 col-lg-3">
                        <app-input-string [formField]="addCarForm.regNumber" label="{{ $labelMessage() }}" placeHolder="{{ $labelMessage() }}" [submitted]="submitted()" [isRequired]="true"> </app-input-string>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3 col-md-3 col-lg-3">
                        <app-input [formField]="addCarForm.vin" label="{{ labels.VIN }}" placeHolder="{{ labels.VIN }}" [submitted]="submitted()" (onCloseEvent)="focus()"> </app-input>
                    </div>
                    <div class="col-sm-3 col-md-3 col-lg-3">
                        <app-input [formField]="addCarForm.powerBHP" type="number" label="{{ labels.POWERBHP }}" placeHolder="{{ labels.POWERBHP }}" [submitted]="submitted()" (change)="powerBHPChanged()">
                        </app-input>
                    </div>
                    <div class="col-sm-3 col-md-3 col-lg-3">
                        <app-input [formField]="addCarForm.powerkWh" type="number" label="{{ labels.POWERKWH }}" placeHolder="{{ labels.POWERKWH }}" [submitted]="submitted()" (change)="powerkWhChanged()">
                        </app-input>
                    </div>
                    <div class="col-sm-2 col-md-2 col-lg-2">
                        <app-input [formField]="addCarForm.millage" type="number" label="{{ labels.MILLAGE }}" placeHolder="{{ labels.MILLAGE }}" [submitted]="submitted()"> </app-input>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-3 col-md-3 col-lg-3">
                        <app-select [formField]="addCarForm.engineType" label="{{ labels.TYPE_ENGINE }}" [submitted]="submitted()" [data]="staticSelectionService.EngineType"> </app-select>
                    </div>
                    <div class="col-sm-3 col-md-3 col-lg-3">
                        <app-input [formField]="addCarForm.engineModel" label="{{ labels.CODE_ENGINE }}" placeHolder="{{ labels.CODE_ENGINE }}" [submitted]="submitted()"> </app-input>
                    </div>
                    <div class="col-sm-3 col-md-3 col-lg-3">
                        <app-select [formField]="addCarForm.gearboxType" label="{{ labels.TYPE_GEARBOX }}" [submitted]="submitted()" [data]="staticSelectionService.GearboxType"> </app-select>
                    </div>
                    <div class="col-sm-2 col-md-2 col-lg-2">
                        <app-select [formField]="addCarForm.regionId" label="{{ labels.REGION }}" [submitted]="submitted()" [data]="staticSelectionService.Region"> </app-select>
                    </div>
                </div>
                <div class="row form-floating mt-2">
                    <app-textarea [formField]="addCarForm.description" label="{{ labels.DESCRIPTION_CAR }}" placeHolder="{{ labels.DESCRIPTION_CAR }}" [submitted]="submitted()"> </app-textarea>
                </div>
            </form>
        </div>
    }
    <div class="row mt-3" style="position: relative">
        <app-imagelist [itemId]="$carId() ?? $newCarId()" [UpdateFlag]="true" [mainImage]="mainImageId!" (defaultImageEvent)="defaultImageChanged($event)"></app-imagelist>
        <div class="d-inline-flex justify-content-end position-buttons w-100">
            <app-toolbar [canCancel]="true" [isChanged]="true" [canSave]="$canUpdate()" [saveName]="$actionMessage()" [cancelName]="labels.GOBACK" (Save)="onSubmit()" (Cancel)="cancel()"></app-toolbar>
        </div>
    </div>
</div>
