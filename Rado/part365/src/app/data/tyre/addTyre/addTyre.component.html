<div class="container">
    @if (saving) {
        <div>
            <button class="btn btn-primary" type="button" disabled>
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                Saving...
            </button>
        </div>
    }
    <div class="title">{{ tyreDescription }}</div>
    <form class="p-2" style="background-color: rgb(11, 245, 233)" autocomplete="off">
        <div class="custom-flex">
            <div [ngClass]="homeService.showBackgroundImage() ? 'show' : 'noShow'">
                <div class="custom-flex">
                    <div class="ps-0" [ngStyle]="{ display: 'flex' }">
                        <app-radiogrouplist [style]="2" [radios]="radioTypes" controlName="itemTypeName" [formField]="addTyreForm.itemType"></app-radiogrouplist>
                    </div>
                </div>
            </div>
        </div>
        <div class="tyre mb-2" [ngClass]="{ show: $displayTyre(), noShow: !$displayTyre() }">
            <h5>Гума</h5>
            <div class="row">
                <div class="col-sm-2 min150px">
                    <app-select [formField]="addTyreForm.tyreWidth" label="{{ labels.TYRE_WIDTH }}" [submitted]="submitted" [isRequired]="true" data-cy="tyreWidth" [data]="tyreWidth" (onCloseEvent)="focus($event)">
                    </app-select>
                </div>
                <div class="col-sm-2 min200px">
                    <app-select
                        [formField]="addTyreForm.tyreHeight"
                        label="{{ labels.TYRE_HEIGHT }}"
                        [submitted]="submitted"
                        [isRequired]="true"
                        data-cy="tyreHeight"
                        [data]="tyreHeight"
                        (onCloseEvent)="focus($event)">
                    </app-select>
                </div>
                <div class="col-sm-2 min150px">
                    <app-select
                        [formField]="addTyreForm.tyreRadius"
                        label="{{ labels.TYRE_RADIUS }}"
                        [submitted]="submitted"
                        [isRequired]="true"
                        data-cy="tyreRadius"
                        [data]="tyreRadius"
                        (onCloseEvent)="focus($event)">
                    </app-select>
                </div>
                @if ($displayTyre()) {
                    <div class="col-sm-1 min150px">
                        <app-input [formField]="addTyreForm.count" [number]="true" [inline]="true" [submitted]="submitted" label="Брой" data-cy="count" [isRequired]="true"></app-input>
                    </div>
                }
                <div class="col-sm-2 min150px">
                    <app-select [formField]="addTyreForm.tyreType" label="{{ labels.TYRE_TYPE }}" [submitted]="submitted" data-cy="tyreType" [data]="tyreTypes" (onCloseEvent)="focus($event)" [isRequired]="true">
                    </app-select>
                </div>
                <div class="col-sm-3 min200px">
                    <app-select
                        id="tyreCompanyId"
                        [formField]="addTyreForm.tyreCompanyId"
                        data-cy="tyreCompanyId"
                        label="{{ labels.TYRE_PRODUCER }}"
                        [data]="tyreProducers"
                        [submitted]="submitted"
                        (onCloseEvent)="focus($event)"
                        [isRequired]="false">
                    </app-select>
                </div>
            </div>
        </div>
        @if ($displayTyre() || $displayRim()) {
            <div class="row mb-2">
                <div class="d-inline-flex align-items-end">
                    <div class="col-sm-1 control min50px max100px me-2">
                        <app-select id="month" tooltip="'Mесец DOT'" [formField]="addTyreForm.monthDOT" data-cy="month" label="DOT" [data]="months" (onCloseEvent)="focus($event)" [submitted]="submitted">
                        </app-select>
                    </div>
                    <div class="col-sm-1 control min50px max100px">
                        <app-select id="year" [formField]="addTyreForm.yearDOT" data-cy="year" [data]="years" (onCloseEvent)="focus($event)" [submitted]="submitted"> </app-select>
                    </div>
                </div>
            </div>
        }
        <div class="rim mb-2" [ngClass]="{ show: $displayRim(), noShow: !$displayRim() }">
            <h5>Джанта</h5>
            <div class="row">
                <div class="col-sm-4 control max250px">
                    <app-company-choise id="companyId"  [formField]="addTyreForm.companyId" data-cy="companyId" [config]="{ all: true, bus: 0, userId: userId() , itemType: currentitemType(), showCount: false }" (onCloseEvent)="focus($event)">
                    </app-company-choise>
                </div>
                @if (this.companyId) {
                    <div class="col-sm-5 control min300px">
                        <app-model-choice
                            [formField]="addTyreForm.modelId"
                            [showCount]="false"
                            [showGroup]="false"
                            [all]="true"
                            [companyId]="companyId!"
                            [groupDisabled]="false"
                            [multiselection]="false">
                        </app-model-choice>
                    </div>
                }
            </div>
            <div class="row">
                @if ($displayRim()) {
                    <div class="col-sm-2 min150px">
                        <app-select
                            [formField]="addTyreForm.tyreRadius"
                            label="{{ labels.TYRE_RADIUS }}"
                            [submitted]="submitted"
                            [isRequired]="true"
                            data-cy="tyreRadius"
                            [data]="tyreRadius"
                            (onCloseEvent)="focus($event)">
                        </app-select>
                    </div>
                }
                <div class="col-sm-3 control min250px">
                    <app-select
                        id="rimMaterial"
                        tooltip="'Материал'"
                        [formField]="addTyreForm.rimMaterial"
                        data-cy="rimMaterial"
                        label="Материал"
                        displayProperty="text"
                        valueProperty="value"
                        [data]="rimMaterial"
                        (onCloseEvent)="focus($event)"
                        [submitted]="submitted">
                    </app-select>
                </div>
                <div class="col-sm-3 control min250px">
                    <app-select
                        id="rimOffset"
                        tooltip="''"
                        [formField]="addTyreForm.rimOffset"
                        data-cy="rimOffset"
                        label="Офсет"
                        displayProperty="text"
                        valueProperty="value"
                        [data]="rimOffset"
                        (onCloseEvent)="focus($event)"
                        [submitted]="submitted">
                    </app-select>
                </div>
                <div class="col-sm-3 control min150px">
                    <app-select
                        id="rimBoltCount"
                        tooltip="'Брой Болтове'"
                        [formField]="addTyreForm.rimBoltCount"
                        data-cy="rimBoltCount"
                        label="Брой Болтове"
                        [data]="rimBoltCount"
                        (onCloseEvent)="focus($event)"
                        [isRequired]="true"
                        [submitted]="submitted">
                    </app-select>
                </div>
                <div class="col-sm-3 control min250px">
                    <app-select
                        id="rimBoltCount"
                        tooltip="'Междуболтово разстояние'"
                        [formField]="addTyreForm.rimBoltDistance"
                        data-cy="rimBoltDistance"
                        label="Междуболтово разстояние"
                        [data]="rimBoltDistances"
                        (onCloseEvent)="focus($event)"
                        [submitted]="submitted">
                    </app-select>
                </div>
                <div class="col-sm-3 control min150px">
                    <app-select
                        id="rimBoltCount"
                        tooltip="'Брой Болтове'"
                        [formField]="addTyreForm.rimCenter"
                        data-cy="rimCenter"
                        label="Център"
                        [data]="rimCenters"
                        (onCloseEvent)="focus($event)"
                        [submitted]="submitted">
                    </app-select>
                </div>
                @if (currentitemType() !== 3) {
                    <div class="col-sm-1 min150px">
                        <app-input [formField]="addTyreForm.count" [number]="true" [inline]="true" [submitted]="submitted" label="Брой" data-cy="count" [isRequired]="true"></app-input>
                    </div>
                }
            </div>
        </div>
        <div class="row mb-2">
            <div class="col-sm-4">
                <app-select [formField]="addTyreForm.regionId" label="{{ labels.REGION }}" [submitted]="submitted" data-cy="region" [data]="regions" (onCloseEvent)="focus($event)" [submitted]="submitted">
                </app-select>
            </div>
        </div>
        <div class="row form-floating mb-2">
            <app-textarea [formField]="addTyreForm.description" placeHolder="{{ labels.PART_DETAILS }}" data-cy="description" [submitted]="submitted"> </app-textarea>
        </div>
        <div class="row g-3">
            <div class="d-inline">
                <app-input
                    [formField]="addTyreForm.price"
                    placeHolder="{{ labels.PRICE }}"
                    [IsPrice]="true"
                    [submitted]="submitted"
                    label="{{ labels.PRICE }}"
                    data-cy="price"
                    [inline]="false"
                    [isRequired]="true"></app-input>
            </div>
        </div>

        <!-- <div class="d-inline-flex justify-content-end">
            <app-toolbar [canCancel]="true" [changed]="changed" [canSave]="updateFlag" [saveName]="action" [cancelName]="labels.GOBACK" (Save)="onSubmit()" (Cancel)="cancel()"></app-toolbar>
        </div> -->
        <div class="row mt-3" style="position: relative">
            <app-imagelist [itemId]="itemId()" [UpdateFlag]="true" [mainImage]="mainImageId!" (defaultImageEvent)="defaultImageChanged($event)"></app-imagelist>
            <div class="d-inline-flex justify-content-end position-buttons w-100">
                <app-toolbar [canCancel]="true" [isChanged]="true" [canSave]="$canUpdate()" [saveName]="$actionMessage()" [cancelName]="labels.GOBACK" (Save)="onSubmit()" (Cancel)="cancel()"></app-toolbar>
            </div>
        </div>
    </form>
</div>
