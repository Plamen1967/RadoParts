@if (multiselection()) {
    <app-multiselection
        id="modificationId"
        label="Модификация"
        placeHolder="Избери модификация"
        [value]="value()"
        [showGroup]="false"
        [groupDisabled]="false"
        [data]="modifications()"
        [showLetter]="false"
        [multiSelection]="multiselection()"
        [useLetter]="false"
        [useFilter]="useFilter()"
        [errors]="errors()"
        #tooltip="matTooltip"
        matTooltip="Избери модификация"
        [matTooltipPosition]="positionOptions[0]"
        data-cy="modificationId"
        data-bs-toggle="tooltip"
        data-bs-placement="right"
        [isRequired]="isRequired()"
        [submitted]="submitted()"
        [showCount]="showCount()"
        (onCloseEvent)="focus()">
        (changeOption)="value.set($event)"
    </app-multiselection>
} @else {
    <app-customselect
        id="modificationId"
        [data]="modifications()"
        [value]="value()"
        label="Модификация"
        [placeHolder]="'Избери модификация'"
        [useFilter]="useFilter()"
        [errors]="errors()"
        [isRequired]="isRequired()"
        [submitted]="submitted()"
        [showCount]="showCount()"
        (changeOption)="value.set($event)"
        #tooltip="matTooltip"
        matTooltip="Избери модификация"
        [matTooltipPosition]="positionOptions[0]"
        data-cy="modificationId"
        data-bs-toggle="tooltip"
        data-bs-placement="right">
    </app-customselect>
}
