    @if (multiselection()) {
        <app-multiselection
            id="modificationId"
            label="Модификация"
            placeHolder="Избери модификация"
            [value]="value()"
            [appToolTip]="'Избери модификация'"
            [showGroup]="false"
            [groupDisabled]="false"
            [data]="modifications()"
            [showLetter]="false"
            [multiSelection]="multiselection()"
            [useLetter]="false"
            [useFilter]="useFilter()"
            data-cy="modificationId"
            data-bs-toggle="tooltip"
            data-bs-placement="right"
            [IsRequired]="IsRequired()"
            [submitted]="submitted()"
            [showCount]="showCount()"
            (onCloseEvent)="focus()">
            (changeOption)="value.set($event)"
        </app-multiselection>
    } @else {
        <app-customselect
            id="modificationId"
            [data]="modifications()"
            [value]="value()"
            label="Модификация"
            [placeHolder]="'Избери модификация'"
            [appToolTip]="'Избери модификация'"
            [useFilter]="useFilter()"
            data-cy="modificationId"
            [IsRequired]="IsRequired()"
            [submitted]="submitted()"
            [showCount]="showCount()"
            (changeOption)="value.set($event)"
            data-bs-toggle="tooltip"
            data-bs-placement="right">
        </app-customselect>
    }
