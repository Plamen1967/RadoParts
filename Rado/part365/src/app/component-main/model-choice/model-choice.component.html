@if (multiselection()) {
    <app-multiselection
        id="modelId"
        label="Модел"
        [value]=value()
        placeHolder="Избери модел"
        [showGroup]="showGroup()"
        [data]="models()"
        [showLetter]="showLetter()"
        [multiSelection]="multiselection()"
        [useLetter]="useLetter()"
        [useFilter]="useFilter()"
        [submitted]="submitted()"
        [showCount]="showCount()"
        [isRequired]="isRequired()"
        [groupDisabled]="groupDisabled()"
        [errors]="errors()"
        data-cy="modelsId"
        data-bs-toggle="tooltip"
        data-bs-placement="right"
        (changeOption)="value.set($event)"
        (onCloseEvent)="focus()"
        #tooltip="matTooltip"
        matTooltip="Избери модела"
        [matTooltipPosition]="positionOptions[0]"
        >
    </app-multiselection>
} @else {
    <app-customselect
        id="modelId"
        [value]=value()
        [data]="models()"
        label="Модел"
        [showGroup]="showGroup()"
        [isRequired]="isRequired()"
        [groupDisabled]="groupDisabled()"
        [placeHolder]="'Избери модел'"
        [errors]="errors()" 
        [useFilter]="useFilter()"
        [submitted]="submitted()"
        [showCount]="showCount()"
        (changeOption)="value.set($event)"
        #tooltip="matTooltip"
        matTooltip="Избери модела"
        [matTooltipPosition]="positionOptions[0]"
        data-cy="modelsId"
        data-bs-toggle="tooltip"
        data-bs-placement="right">
    </app-customselect>
}
