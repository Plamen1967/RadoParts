<app-select-base
    [type]="type"
    [label]="label"
    [hint]="hint"
    [data]="data"
    [initialValue]="selectedValue!"
    [group]="group"
    [isRequired]="IsRequired()"
    [groupSelection]="groupSelection"
    [submitted]="submitted"
    [isInvalid]="IsInvalid()"
    [id]="id"
    [error]="error()"
    (changeOption)="changeSelectOption($event)">
</app-select-base>
