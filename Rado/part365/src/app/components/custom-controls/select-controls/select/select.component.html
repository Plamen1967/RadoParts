<app-select-base
    [type]="type()"
    [label]="label()"
    [hint]="hint()"
    [data]="_data()"
    [initialValue]="value()"
    [group]="group()"
    [isRequired]="isRequired()"
    [groupSelection]="groupSelection()"
    [submitted]="submitted()"
    [isInvalid]="IsInvalid()"
    [id]="id()"
    [error]="error()"
    (changeOption)="changeSelectOption($event)">
</app-select-base>
