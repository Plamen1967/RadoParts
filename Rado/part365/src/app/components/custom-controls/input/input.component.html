<div [ngClass]="{ select__margin: border }">
    <div [ngClass]="{ select__container: border }">
        <div [ngClass]="{ select__field: border }">
            <div class="input-group d-inline-flex align-items-center">
                @if (prefix()) {
                    <span id="id" [ngStyle]="{ 'background-color': 'lightgray' }" class="ps-1 pe-1 form-control-sm">{{ prefix() }}</span>
                }
                <input
                    [value]="value()"
                    [type]="number() ? 'number' : 'text'"
                    autocomplete="{{ autocomplete() }}"
                    placeholder="{{ placeHolder() }}"
                    pattern="{{ Pattern() }}"
                    min="0"
                    max="20"
                    step="1"
                    class="form-control shadow active"
                    [ngClass]="{ keywordClass: keyword() === true, 'is-invalid': submitted() && IsInvalid, currency: IsPrice, 'form-control': true,  active: true }"
                    (input)="inputFunc()"
                    id="{{ contolName }}"
                    aria-describedby="id"
                    (focus)="onFocus()"
                    (blur)="onBlur()" />

                @if (IsPrice()) {
                    <span class="currency" [ngClass]="{ 'form-control-sm': true}">EURO</span>
                    @if (IsRequired()) {
                        <span class="fw-bold" [ngStyle]="{ color: 'red', 'font-size': '1em', 'padding-left': '1px' }">*</span>
                    }
                }
                @if (suffix()) {
                    <span id="id" [ngStyle]="{ 'background-color': 'lightgray' }" class="ps-1 pe-1 form-control-sm">{{ suffix() }}</span>
                }
            </div>
            <div class="select__label" [ngClass]="{ required: IsRequired }">
                {{ label() }}
                @if (label() && IsRequired()) {
                    <span class="fw-bold" [ngStyle]="{ color: 'red', 'font-size': '1em', 'padding-left': '2px' }">*</span>
                }
            </div>
        </div>
        @if (submitted() && IsInvalid()) {
            <div class="invalid-feedback d-block">
                <small>{{ errorMessage() }}</small>
            </div>
        }
    </div>
</div>
