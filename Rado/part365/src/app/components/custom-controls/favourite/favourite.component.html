<div
    [ngClass]="{ paddingClass: positionEnd() === 1 ? true : false, positionEnd: positionEnd() === 0 ? true : false }"
    [ngClass]="{ 'min-width': '1.2em', 'pading-left': '1px', 'pading-right': '1px' }"
    role="none">
    @if (isSaved()) {
        <div style="display: flex; flex-direction: column">
            <button data-toggle="tooltip" data-placement="top" title="Отмени запазена обява" class="favoirite saved" (click)="unsave()">
                <span
                    class="material-symbols-outlined selected" style="font-size: 30px;">star</span
                >
            </button>
        </div>
    } @else {
        <div style="display: flex; flex-direction: column">
            <button data-toggle="tooltip" data-placement="top" title="Отмени запазена обява" class="favoirite saved" (click)="save()">
                <span
                    class="material-symbols-outlined"  style="font-size: 30px;">star</span>
            </button>
        </div>
    }
</div>
