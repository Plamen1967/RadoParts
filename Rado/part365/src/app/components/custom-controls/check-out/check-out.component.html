<div class="container">
    @if (viewId()) {
        <app-userviewpart (back)="back(viewId()!)" [currentViewId]="viewId()"(changeNext)="(false)" (changePrev)="(false)" [checkout]="true"></app-userviewpart>
    } @else {
        @if (loading()) {
        } @else {
            @if (parts() && parts().length) {
                <div class="rowCar">
                    @if (!loading()) {
                        <div class="container mt-3">
                            <div class="mt-2 mb-2 text-center">
                                <button class="btn btn-success" (click)="clear()">Изчисти запазени</button>
                            </div>
                            <div class="row">
                                @for (part of parts(); track part.id; let i = $index) {
                                    <div id="{{ part.id }}">
                                        <app-displaypart (checkoutUpdated)="update()" [allowUpdate]="false" [part]="part" (action)="action($event)" [highlighted]="+heigligthed!" [allowUpdate]="false" [showDealer]="true">
                                        </app-displaypart>
                                    </div>
                                }
                            </div>
                            <div class="mt-2 mb-2 text-center">
                                <button class="btn btn-success" (click)="clear()">Изчисти запазени</button>
                            </div>
                        </div>
                    }
                </div>
            } @else {
                <div class="d-flex justify-content-center" style="flex-direction: column;">
                    <h6 class="me-2 d-flex justify-content-center">Няма запазени обяви</h6>
                    <button class="btn btn-primary" style="width: auto; margin: auto;" (click)="goback()">Назaд</button>
                </div>
            }
        }
    }
</div>
