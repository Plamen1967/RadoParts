@if (multiselection()) {
    <app-multiselection
        [isRequired]="isRequired()"
        id="categoriesId_int"
        label="Избери категория"
        [value]="value()"
        placeHolder="Избери категория"
        [submitted]="submitted()"
        [errors]="errors()"
        [data]="$category()"
        [multiSelection]="multiselection()"
        (changeOption)="value.set($event)"
        #tooltip="matTooltip"
        matTooltip="Избери категория"
        [matTooltipPosition]="positionOptions[0]"
        data-cy="categoriesId"
        data-bs-toggle="tooltip"
        data-bs-placement="right"
        title="Избери категория">
    </app-multiselection>
} @else {
    <app-customselect
        [isRequired]="isRequired()"
        [submitted]="submitted()"
        [errors]="errors()"
        id="categoriesId_int"
        title="Избери категория"
        placeHolder="Избери категория"
        label="Избери категория"
        [value]="value()"
        [data]="$category()"
        [showGroup]="false"
        [groupDisabled]="false"
        (changeOption)="value.set(+$event)"
        #tooltip="matTooltip"
        matTooltip="Избери категория"
        [matTooltipPosition]="positionOptions[0]"
        data-cy="categoriesId"
        data-bs-toggle="tooltip"
        data-bs-placement="right">
    </app-customselect>
}
