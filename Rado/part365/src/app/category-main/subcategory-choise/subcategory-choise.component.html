@if (multiselection()) {
    <app-multiselection
        [isRequired]="isRequired()"
        id="subCategoriesId_int"
        label="Избери подкатегория"
        [value]="value()"
        placeHolder="Избери подкатегория"
        [errors]="errors()"
        [data]="subCategories"
        [multiSelection]="multiselection()"
        data-cy="subCategoriesId_int"
        data-bs-toggle="tooltip"
        data-bs-placement="right"
        (changeOption)="value.set($event)"
        [submitted]="submitted()"
        #tooltip="matTooltip"
        matTooltip="Избери подкатегория"
        [matTooltipPosition]="positionOptions[0]"
        title="Избери подкатегория">
    </app-multiselection>
} @else {
    <app-customselect
        [isRequired]="isRequired()"
        [errors]="errors()"
        id="subCategoriesId"
        title="Избери подкатегория"
        placeHolder="Избери подкатегория"
        label="Избери подкатегория"
        [value]="value()"
        [data]="subCategories"
        [showGroup]="false"
        [groupDisabled]="false"
        [submitted]="submitted()"
        (changeOption)="value.set(+$event)"
        #tooltip="matTooltip"
        matTooltip="Избери подкатегория"
        [matTooltipPosition]="positionOptions[0]"
        data-cy="subCategoriesId"
        data-bs-toggle="tooltip"
        data-bs-placement="right">
    </app-customselect>
}
