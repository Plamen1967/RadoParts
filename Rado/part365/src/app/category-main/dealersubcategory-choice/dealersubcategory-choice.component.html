@if (dealerSubCategories() && dealerSubCategories().length > 0) {
    <app-customselect style="width: 100%;"
        id="dealerSubCategoriesId_int"
        title="Избери Подкатегория Дилър"
        placeHolder="Избери Подкатегория Дилър"
        label="Избери Подкатегория Дилър"
        [value]="value()"
        [data]="dealerSubCategories()"
        [showGroup]="false"
        [groupDisabled]="false"
        [isRequired]="isRequired()"
        [submitted]="submitted()"
        [appToolTip]="'Избери Подкатегория Дилър'"
        data-cy="dealerSubCategoriesId"
        data-bs-toggle="tooltip"
        (changeOption)="value.set(+$event)"
        data-bs-placement="right">
    </app-customselect>
}
