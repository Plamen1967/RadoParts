<div class="layout">
    <div class="categoryMax">
        @if (showCategory) {
            <app-categories id="categoriesElem" #categoriesElem [dropDowns]="categoriesFooter()" (selection)="onSelection($event)" data-cy="categories" class="categories"></app-categories>
        }
    </div>
    <div class="w-100">
        <form class="form-background homeForm">
            <div class="row mb-1">
                @if (admin) {
                    <div class="row">
                        <div class="col-sm-4 control min150px">
                            <app-select
                                id="user"
                                [formField]="filterForm.userId"
                                data-cy="userName"
                                label="{{ labels.USERNAME }}"
                                valueProperty="userId"
                                [data]="users"
                                (onCloseEvent)="focus()"
                                displayProperty="userName">
                            </app-select>
                        </div>
                        <div class="col-sm-3 control min150px">
                            <app-select
                                id="approved"
                                [formField]="filterForm.approved"
                                data-cy="approvedType"
                                label="{{ labels.APPROVEAD }}"
                                valueProperty="id"
                                [data]="approvedTypes"
                                (onCloseEvent)="focus()"
                                displayProperty="value">
                            </app-select>
                        </div>
                    </div>
                }
            </div>

            <div class="row">
                <div class="mb-1 d-flex justify-content-center">
                    <app-radiogrouplist [style]="2" [radios]="radioTypes" controlName="itemTypeName" [formField]="filterForm.itemType"></app-radiogrouplist>
                </div>
            </div>

            <div class="row" [ngClass]="{ show: displayAll, noShow: !displayAll }">
                <div class="col-4 col-md-4 col-lg-4 min140px max200px">
                    <app-select [formField]="filterForm.tyreWidth" label="{{ labels.TYRE_WIDTH }}" data-cy="engineType" [data]="tyreWidth" (onCloseEvent)="focus()"> </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min140px max200px">
                    <app-select [formField]="filterForm.tyreHeight" label="{{ labels.TYRE_HEIGHT }}" data-cy="engineType" [data]="tyreHeight" (onCloseEvent)="focus()"> </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min140px max200px">
                    <app-select [formField]="filterForm.tyreRadius" label="{{ labels.TYRE_RADIUS }}" data-cy="engineType" [data]="tyreRadius" (onCloseEvent)="focus()"> </app-select>
                </div>
            </div>
            <div class="row" [ngClass]="{ show: displayTyre, noShow: !displayTyre }">
                <div class="col-4 col-md-4 col-lg-4 min140px max200px">
                    <app-select [formField]="filterForm.tyreWidth" label="{{ labels.TYRE_WIDTH }}" data-cy="engineType" [data]="tyreWidth" (onCloseEvent)="focus()"> </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min140px max200px">
                    <app-select [formField]="filterForm.tyreHeight" label="{{ labels.TYRE_HEIGHT }}" data-cy="engineType" [data]="tyreHeight" (onCloseEvent)="focus()"> </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min140px max200px">
                    <app-select [formField]="filterForm.tyreRadius" label="{{ labels.TYRE_RADIUS }}" data-cy="engineType" [data]="tyreRadius" (onCloseEvent)="focus()"> </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min140px max200px">
                    <app-select [formField]="filterForm.tyreType" label="{{ labels.TYRE_TYPE }}" data-cy="engineType" [data]="tyreTypes" (onCloseEvent)="focus()"> </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min250px max350px">
                    <app-customselect
                        [formField]="filterForm.tyreCompanyId"
                        [useFilter]="true"
                        label="{{ labels.TYRE_PRODUCER }}"
                        data-cy="tyreCompanyId"
                        [data]="tyreProducers"
                        (onCloseEvent)="focus()">
                    </app-customselect>
                </div>
            </div>
            <div class="row" [ngClass]="{ show: displayRim, noShow: !displayRim }">
                <div class="col-5 col-md-5 col-lg-5 control min250px">
                    <div class="w-100">
                        <app-company-choise label="Марка на джанта" data-cy="companyId" [config]="{ all: true, bus: 0, userId: userId(), itemType: itemType }" [formField]="filterForm.companyId">
                        </app-company-choise>
                    </div>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min250px mb-1">
                    @if (companyId) {
                        <app-model-choice
                            [formField]="filterForm.modelId"
                            [showCount]="false"
                            [showGroup]="false"
                            [all]="true"
                            [companyId]="companyId!"
                            [groupDisabled]="false"
                            [multiselection]="false">
                        </app-model-choice>
                    }
                </div>
                <div class="col-4 col-md-4 col-lg-4 min140px">
                    <app-select
                        id="rimWidth"
                        [formField]="filterForm.rimWidth"
                        data-cy="rimWidth"
                        label="Широчина"
                        displayProperty="text"
                        valueProperty="value"
                        [data]="rimWidth"
                        #tooltip="matTooltip"
                        matTooltip="Широчина"
                        [matTooltipPosition]="positionOptions[0]"
                        (onCloseEvent)="focus()">
                    </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min140px">
                    <app-select
                        id="rimMaterial"
                        [formField]="filterForm.rimMaterial"
                        data-cy="rimMaterial"
                        label="Материал"
                        displayProperty="text"
                        valueProperty="value"
                        [data]="rimMaterial"
                        #tooltip="matTooltip"
                        matTooltip="Материал"
                        [matTooltipPosition]="positionOptions[0]"

                        (onCloseEvent)="focus()">
                    </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 control min150px">
                    <app-select
                        id="rimBoltCount"
                        tooltip="'Брой Болтове'"
                        [formField]="filterForm.rimBoltCount"
                        data-cy="rimBoltCount"
                        label="Брой Болтове"
                        [data]="rimBoltCount"
                        (onCloseEvent)="focus()">
                    </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 min140px">
                    <app-select
                        id="rimOffset"
                        [formField]="filterForm.rimOffset"
                        data-cy="rimOffset"
                        label="Офсет"
                        displayProperty="text"
                        valueProperty="value"
                        [data]="rimOffset"
                        (onCloseEvent)="focus()">
                    </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 control min250px">
                    <app-select
                        id="rimBoltCount"
                        tooltip="'Междуболтово разстояние'"
                        [formField]="filterForm.rimBoltDistance"
                        data-cy="rimBoltDistance"
                        label="Междуболтово разстояние"
                        [data]="rimBoltDistances"
                        (onCloseEvent)="focus()">
                    </app-select>
                </div>
                <div class="col-4 col-md-4 col-lg-4 control min250px">
                    <app-select id="rimBoltCount" tooltip="'Брой Болтове'" [formField]="filterForm.rimCenter" data-cy="rimCenter" label="Център" [data]="rimCenters" (onCloseEvent)="focus()">
                    </app-select>
                </div>
            </div>
            <div class="row mt-1">
                <div class="col-4 col-md-4 col-lg-4 max200px">
                    <app-select [formField]="filterForm.regionId" data-cy="regionId" label="{{ labels.REGION }}" [data]="regions" (onCloseEvent)="focus()"> </app-select>
                </div>
            </div>
            <div class="row ms-1 mt-1">
                <div class="col-sm-3 form-check control checkboxClass">
                    <label class="form-check-label" for="hasImages">{{ labels.WITHIMAGES }}</label>
                    <input type="checkbox" class="form-check-input" [formField]="filterForm.hasImages" id="hasImages" data-cy="hasImages" />
                </div>
            </div>
            <app-search-bar [formField]="filterForm.orderBy" (submitEvent)="submit()" (clearEvent)="clearFilter()"></app-search-bar>
        </form>
        <div class="card advert" [hidden]="hideFilter"></div>
        <app-categoriesfooter [categories]="categoriesFooter()" [hidden]="hideFilter" (categoryClick)="categoryClick($event)"></app-categoriesfooter>
    </div>
</div>
